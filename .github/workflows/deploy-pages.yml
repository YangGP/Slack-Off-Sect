name: 部署到 GitHub Pages

# 同时发布 main（根目录）和 dev1（/dev/），避免单分支发布覆盖另一版本。
# Settings → Pages 选择 GitHub Actions；github-pages 环境允许 main、dev1 部署。
on:
  push:
    branches: [main, dev1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 检查并构建 ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 构建当前分支
        run: npm run build
        env:
          VITE_DEPLOY_CHANNEL: ${{ matrix.branch == 'dev1' && 'dev' || 'production' }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.branch }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  package:
    name: 合并正式版与开发预览版
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-main
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-dev1
          path: site/dev
      - name: 确认两个入口完整
        run: |
          test -f site/index.html
          test -f site/dev/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 发布合并后的站点
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
