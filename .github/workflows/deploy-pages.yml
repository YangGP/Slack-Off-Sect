name: 部署到 GitHub Pages

# 推到 main 就跑：先过三层测试，再构建并发布到 Pages。
# 一次性设置：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ① 质量门：测试不过就不发布（引擎 405 项 / SSR 渲染 17 项 / jsdom 端到端 150 项）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # ② 构建静态站点（vite.config.js 的 base 是 './'，相对路径，能直接挂在子路径下）
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ③ 发布
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
